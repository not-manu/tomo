name: tomo

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  api:
    build: ..
    image: tomo-api:${VERSION:-dev}
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      PORT: 8666
    env_file: ../../.env
    group_add:
      - "113"
    volumes:
      - /data/tomo:/data/tomo
      - /var/run/docker.sock:/var/run/docker.sock
    expose:
      - "8666"

  tools:
    profiles: [tools]
    build:
      context: ..
      target: build
    image: tomo-tools:${VERSION:-dev}
    user: "1000:1000"
    working_dir: /app/packages/api
    env_file: ../../.env
    environment:
      ENVIRONMENT: production
      HOME: /tmp
    volumes:
      - /data/tomo:/data/tomo
    ports:
      - "127.0.0.1:4983:4983"
    command: pnpm exec drizzle-kit studio --host 0.0.0.0 --port 4983

volumes:
  caddy_data:
  caddy_config:
