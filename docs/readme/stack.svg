<svg xmlns="http://www.w3.org/2000/svg" width="800" height="260" viewBox="0 0 800 260" role="img" aria-label="browsers talk to caddy, which fronts the node api; the api keeps app data in sqlite and runs one docker container per workspace where the shell, files and codex live">
<style>
:root{--ink:#100F0F;--mute:#6F6E69;--line:#B7B5AC;--face:#FFFCF0;--acc:#205EA6;--agt:#BC5215}
@media (prefers-color-scheme:dark){:root{--ink:#CECDC3;--mute:#878580;--line:#575653;--face:#1C1B1A;--acc:#4385BE;--agt:#DA702C}}
text{font-family:Geist,ui-sans-serif,system-ui,-apple-system,sans-serif;fill:var(--ink)}
.t{font-size:14px;font-weight:600}
.s{font-family:"Berkeley Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;fill:var(--mute)}
.b{fill:var(--face);stroke:var(--ink);stroke-width:1.5}
.f{fill:none;stroke:var(--line);stroke-width:1.2;stroke-dasharray:5 5}
.w{fill:none;stroke:var(--ink);stroke-width:1.5;stroke-linecap:round}
.ws{stroke:var(--acc);stroke-dasharray:6 5}
.ah{fill:var(--ink)}.aha{fill:var(--acc)}
</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
<marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aha" d="M0 0L10 5L0 10z"/></marker>
</defs>

<rect class="b" x="20" y="90" width="130" height="64" rx="6"/>
<text class="t" x="36" y="116">browser</text>
<text class="s" x="36" y="138">react · yjs</text>

<rect class="b" x="200" y="90" width="100" height="64" rx="6"/>
<text class="t" x="216" y="116">caddy</text>
<text class="s" x="216" y="138">https</text>

<rect class="b" x="350" y="90" width="150" height="64" rx="6"/>
<text class="t" x="366" y="116">api</text>
<text class="s" x="366" y="138">node · hono · yjs</text>

<rect class="b" x="375" y="196" width="100" height="44" rx="6"/>
<text class="t" x="391" y="223">sqlite</text>

<rect class="f" x="550" y="30" width="230" height="210" rx="8"/>
<text class="s" x="566" y="52">docker · one per workspace</text>
<rect class="b" x="566" y="66" width="198" height="44" rx="6"/>
<text class="t" x="582" y="93">shell</text><text class="s" x="740" y="93" text-anchor="end">pty</text>
<rect class="b" x="566" y="120" width="198" height="44" rx="6"/>
<text class="t" x="582" y="147">files</text><text class="s" x="740" y="147" text-anchor="end">/workspace</text>
<rect class="b" x="566" y="174" width="198" height="44" rx="6" style="stroke:var(--agt)"/>
<text class="t" x="582" y="201" style="fill:var(--agt)">codex</text><text class="s" x="740" y="201" text-anchor="end">→ openai</text>

<path class="w" d="M152 112h46" marker-start="url(#a)" marker-end="url(#a)"/>
<path class="w ws" d="M152 132h46" marker-start="url(#aa)" marker-end="url(#aa)"/>
<path class="w" d="M302 112h46" marker-start="url(#a)" marker-end="url(#a)"/>
<path class="w ws" d="M302 132h46" marker-start="url(#aa)" marker-end="url(#aa)"/>
<path class="w" d="M425 156v38" marker-start="url(#a)" marker-end="url(#a)"/>
<path class="w" d="M502 112h46" marker-start="url(#a)" marker-end="url(#a)"/>
<path class="w ws" d="M502 132h46" marker-start="url(#aa)" marker-end="url(#aa)"/>

<path class="w" d="M20 36h28" marker-end="url(#a)"/><text class="s" x="58" y="40">request</text>
<path class="w ws" d="M130 36h28" marker-end="url(#aa)"/><text class="s" x="168" y="40">live · websocket</text>
</svg>
